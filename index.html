<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방 배정">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239A4B5C'/%3E%3Cpath d='M18 30 32 18l14 12v16H18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>태교캠프 방 배정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F3F1;--card:#FFFFFF;--card-2:#FAF8F6;
  --ink:#1D1917;--ink-2:#5F5652;--ink-3:#958A85;
  --line:#E7E1DD;--line-strong:#D4CBC6;
  --accent:#9A4B5C;--accent-wash:#F5E9EC;--bad:#B3261E;
  --shadow:0 1px 2px rgba(29,25,23,.05),0 8px 22px -16px rgba(29,25,23,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141110;--card:#1D1918;--card-2:#221E1C;
    --ink:#EEE8E5;--ink-2:#B2A7A2;--ink-3:#80756F;
    --line:#2E2826;--line-strong:#433B38;
    --accent:#E39AAB;--accent-wash:#3A2228;--bad:#F2B8B5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#141110;--card:#1D1918;--card-2:#221E1C;
  --ink:#EEE8E5;--ink-2:#B2A7A2;--ink-3:#80756F;
  --line:#2E2826;--line-strong:#433B38;
  --accent:#E39AAB;--accent-wash:#3A2228;--bad:#F2B8B5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px;display:flex;flex-direction:column;gap:30px}
[hidden]{display:none!important}

header{padding-top:52px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.eyebrow{margin:0;font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:12px;letter-spacing:.14em;font-weight:500;color:var(--accent)}
h1{margin:0;font-size:clamp(28px,6vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.lede{margin:0;max-width:34em;color:var(--ink-2);font-size:15px;font-weight:300;word-break:keep-all}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tally b{font-size:12.5px;font-weight:400;color:var(--ink-2);background:var(--card);border:1px solid var(--line);padding:4px 11px;border-radius:99px}
.tally b i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink);margin-right:5px}

/* 잠금 */
.lock{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.lock h2{margin:0;font-size:17px;font-weight:600}
.lock p{margin:0;font-size:13.5px;color:var(--ink-2);font-weight:300;word-break:keep-all}
.pinrow{display:flex;gap:8px}
.pin{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:24px;letter-spacing:.5em;text-align:center;
  padding:12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card-2);color:var(--ink);outline:none}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.btn{border:0;border-radius:8px;padding:0 20px;background:var(--accent);color:var(--card);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.lock .err{color:var(--bad);font-weight:400;min-height:1.4em}

/* 검색 */
.app{display:flex;flex-direction:column;gap:30px}
.search label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:8px}
.box{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:0 15px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.box svg{flex:0 0 17px;width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round}
input[type="search"]{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:none;padding:14px 0;margin:0;color:var(--ink);font-family:inherit;font-size:17px;font-weight:500}
input[type="search"]::placeholder{color:var(--ink-3);font-weight:400}
input[type="search"]::-webkit-search-cancel-button{display:none}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:300;word-break:keep-all}
.hint code{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:12px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);padding:1px 5px;border-radius:3px}

.results{display:flex;flex-direction:column;gap:10px;min-height:150px}
.state{border:1px solid var(--line);border-radius:8px;padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px;font-weight:300;background:var(--card-2);word-break:keep-all}
.state strong{display:block;font-weight:500;font-size:15px;color:var(--ink-2);margin-bottom:5px}
.count{margin:0;font-size:12.5px;color:var(--ink-3)}
.row{display:grid;grid-template-columns:96px 1fr;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.room{background:var(--accent-wash);border-right:1px solid var(--line);display:flex;align-items:baseline;justify-content:center;align-content:center;flex-wrap:wrap;padding:22px 8px;gap:2px}
.room .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:36px;line-height:1;color:var(--accent)}
.room .unit{font-size:15px;font-weight:500;color:var(--accent)}
.who{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.who .nm{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.who .nm mark{background:var(--accent-wash);color:var(--accent);padding:0 2px;border-radius:2px}
.who .mate{margin:0;font-size:13.5px;color:var(--ink-2);font-weight:300}
.who .mate span{color:var(--ink);font-weight:400}

.board summary{cursor:pointer;list-style:none;display:flex;align-items:center;font-size:14.5px;font-weight:500;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.board summary::-webkit-details-marker{display:none}
.board summary::after{content:"＋";margin-left:auto;color:var(--ink-3)}
.board[open] summary::after{content:"－"}
.grid{display:grid;gap:8px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 13px}
.cell b{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-size:16px;font-weight:600}
.cell b small{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px;margin-left:1px}
.cell div{font-size:13.5px;color:var(--ink-2);margin-top:2px}

footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--ink-3);font-weight:300;line-height:1.85;word-break:keep-all}
footer b{font-weight:500;color:var(--ink-2)}
/* ── 모바일 ─────────────────────────── */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(60px,env(safe-area-inset-bottom))}
.clear{flex:0 0 auto;display:none;align-items:center;justify-content:center;width:32px;height:32px;margin-right:-8px;border:0;border-radius:50%;background:var(--card-2);color:var(--ink-2);font-size:16px;cursor:pointer}
.box.has .clear{display:flex}
.btn{min-height:52px}
summary{min-height:48px}
@media (max-width:520px){
  header{padding-top:max(28px,env(safe-area-inset-top));gap:8px}
  h1{font-size:28px}
  .lede{font-size:14px}
  .wrap{gap:22px}
  .app{gap:22px}
  .lock{padding:22px 18px}
  .pin{font-size:26px;padding:14px 8px}
  .search{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px 12px;
    padding-top:max(10px,env(safe-area-inset-top));background:var(--ground);border-bottom:1px solid transparent}
  .search label{display:none}
  .hint{margin-top:8px;font-size:12px}
  input[type="search"]{font-size:18px;padding:15px 0}
  .results{min-height:0}
  .state{padding:30px 16px}
  .row{grid-template-columns:84px 1fr}
  .room{padding:20px 6px}
  .room .num{font-size:32px}
  .who{padding:16px}
  .who .nm{font-size:21px}
  .who .mate{font-size:14px}
  .grid{grid-template-columns:1fr 1fr;gap:7px}
  .cell{padding:10px 12px}
  .cell div{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">국세청 태교캠프 · 강릉 10.14–10.16</p>
    <h1>방 배정 조회</h1>
    <p class="lede">성함을 검색하면 배정된 호수와 함께 지내는 분을 확인할 수 있습니다.</p>
    <div class="tally" id="tally" hidden>
      <b><i id="tPeople">—</i>명</b>
      <b><i id="tRooms">—</i>개 호실</b>
    </div>
  </header>

  <form class="lock" id="lock" autocomplete="off">
    <h2>비밀번호를 입력해 주세요</h2>
    <p>참가자 개인정보 보호를 위해 비밀번호가 있어야 명단을 볼 수 있습니다.</p>
    <div class="pinrow">
      <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="비밀번호" autofocus>
      <button class="btn" id="go" type="submit">확인</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="app" id="app" hidden>
    <section class="search">
      <label for="q">이름 검색</label>
      <div class="box">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5 17 17"></path></svg>
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="성함을 입력하세요">
        <button class="clear" id="clear" type="button" aria-label="지우기">✕</button>
      </div>
      <p class="hint">초성(<code>ㄱㅈㅎ</code>)이나 호수(<code>5호</code>)로도 검색됩니다.</p>
    </section>

    <section class="results" id="results" aria-live="polite"></section>

    <details class="board">
      <summary>전체 배정표</summary>
      <div class="grid" id="grid"></div>
    </details>
  </div>

  <footer>
    호수는 <b>임시 번호</b>입니다. 숙소 루밍리스트가 확정되면 실제 호실로 바뀝니다.<br>
    개인정보 보호를 위해 이름과 호수 외의 정보는 담지 않았습니다.
  </footer>
</div>

<script>
const BLOB = {"s":"l7SinDkuALebeW3ssS7UYA==","i":"+YdJoDa4N0V4nbPzcGDt/Q==","c":"JxMUC0JJ5hI0IiAVGcBlJM1ZtkVwU4t7fKInQz90AA4FBcjnn2HkRSB9seB2BFcsH+lRjLZE2bhb6pBNw1jQ3QLQiwhL2dSRTqK5Wnv5tmZhHBcLEsXeU+I8TmtHk55onXRoOFJsNWOq2dKt+y7AkGYU3Z6p51r14aZLCbnZSEUJNSOyqCrPK1iTux0u8BkuFfHvVcFcSPToaZDF33DnBEnwummRuyD5Evl4CWBzHOv5Q/9qkXZQNjxkVb79n0gNK1S1bsvkSmzL0RWtCmO0kHib4muIwvoo0Fg7NFs5LGoOjqVEO7xb56BmnSf1MKPovnRGG3z3vFQmp8au2/jPot6ctWwiooZDmZqqg2UQ04n7B7OApupc2KQYZsMWJ2XcOtq0nf+TswTkWOfec52QIyVQqWR3oQA1W566tyqhZ9FJKxWOcBU89Glew1gtRxi05kNo1f7+e6pAok9nwrzcsLfJJROeq9zUwCohmwSA0BZ2PSrs43rxGjqhmF03Rrka4wKuTop+8Hbn2VS9HvB9FFCodv7MeQrUMArHbGvrFDC/RhSlxDQ8tSbuBDwwgtdfey82bW2cTy/MKnFpXf2JfbSe4jLrH1gICHNhVbK6AWq2ty3ZDgtvD7p0avTMB125ZxgIdqYEeazXlqa5+uSOUTs0pXmyPRBjzAyHqmBCuE4DCkpRZc3sZPQBBCa3f5gu4xJ0VH+9sDbeMIMSflyIAjewycJXExJP0uhXA9bgnN6c8AoL/6Z7cDdReYlYGd3GMbBNCpYYjYRtUyLPadLKPwVEpm5iiWxPCA+NWs+Yz5zFdayt2gBhqI8UHXhGVrD+Ro0y26rVhzi4ULPZWRQgwLPr3Zof+yus9ExPK4lRLNsNkk0owE0ehEDqNdQHcJk3FbEZKYXL0MOhetRRtv0y5S+Hp6OLiWKyfKSv5x1bxPWyp4US2M5pm9hakWIaSuOG32UbVTj3BTkgNHmXBg4uQw=="};
const KEY = "taegyo-pin";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pin){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(BLOB.s), iterations:600000, hash:"SHA-256" },
    base, { name:"AES-CBC", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-CBC", iv:b64(BLOB.i) }, key, b64(BLOB.c));
  return JSON.parse(new TextDecoder().decode(plain));
}

const lockEl = document.getElementById("lock"), pinEl = document.getElementById("pin"),
      errEl = document.getElementById("err"), goEl = document.getElementById("go");
let busy = false;

async function tryPin(pin, silent){
  if (busy) return;
  busy = true; goEl.disabled = true; errEl.textContent = silent ? "" : "확인 중…";
  try {
    const rooms = await unlock(pin);
    try { sessionStorage.setItem(KEY, pin); } catch (e) {}
    start(rooms);
  } catch (e) {
    errEl.textContent = silent ? "" : "비밀번호가 맞지 않습니다.";
    pinEl.value = ""; pinEl.focus();
  } finally { busy = false; goEl.disabled = false; }
}
lockEl.addEventListener("submit", e => { e.preventDefault(); if (pinEl.value.trim()) tryPin(pinEl.value.trim()); });
pinEl.addEventListener("input", () => { if (pinEl.value.length === 4) tryPin(pinEl.value); });
try { const saved = sessionStorage.getItem(KEY); if (saved) tryPin(saved, true); } catch (e) {}

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const toCho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const isCho = q => q.length > 0 && [...q].every(ch => CHO.includes(ch));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(rooms){
  lockEl.hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("tally").hidden = false;

  const people = rooms.flatMap(r => r.n.map(n => ({ n, r: r.r, mates: r.n.filter(m => m !== n) })));
  document.getElementById("tPeople").textContent = people.length;
  document.getElementById("tRooms").textContent = rooms.length;

  document.getElementById("grid").innerHTML = rooms.map(r =>
    '<div class="cell"><b>' + r.r + '<small>호</small></b><div>' + r.n.map(esc).join(" · ") + "</div></div>").join("");

  const resultsEl = document.getElementById("results"), qEl = document.getElementById("q");
  const mark = (name, q) => {
    if (!q) return esc(name);
    const i = isCho(q) ? toCho(name).indexOf(q) : name.indexOf(q);
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length));
  };
  const row = (p, q) =>
    '<div class="row"><div class="room"><span class="num">' + p.r + '</span><span class="unit">호</span></div>' +
    '<div class="who"><p class="nm">' + mark(p.n, q) + "</p>" +
    (p.mates.length ? '<p class="mate">함께 지내는 분 <span>' + p.mates.map(esc).join(", ") + "</span></p>" : "") +
    "</div></div>";

  function render(){
    const q = qEl.value.replace(/\s+/g, "");
    if (!q){
      resultsEl.innerHTML = '<div class="state"><strong>이름을 입력해 주세요</strong>배정된 호수가 바로 표시됩니다.</div>';
      return;
    }
    const rm = q.match(/^(\d{1,3})(호실?)?$/);
    if (rm){
      const n = Number(rm[1]);
      const hits = people.filter(p => p.r === n);
      resultsEl.innerHTML = hits.length
        ? '<p class="count">' + n + "호 · " + hits.length + "명</p>" + hits.map(p => row(p, "")).join("")
        : '<div class="state"><strong>' + n + '호는 없습니다</strong>1호부터 ' + rooms.length + "호까지 있습니다.</div>";
      return;
    }
    const hits = people.filter(p => isCho(q) ? toCho(p.n).includes(q) : p.n.includes(q));
    resultsEl.innerHTML = hits.length
      ? (hits.length > 1 ? '<p class="count">' + hits.length + "명 검색됨</p>" : "") + hits.map(p => row(p, q)).join("")
      : '<div class="state"><strong>‘' + esc(q) + '’ 님을 찾지 못했습니다</strong>성함을 다시 확인하시거나 운영진에게 문의해 주세요.</div>';
  }
  const boxEl = qEl.parentElement;
  const update = () => { boxEl.classList.toggle("has", qEl.value.length > 0); render(); };
  qEl.addEventListener("input", update);
  // 검색 키를 누르면 키보드를 내려 결과가 화면에 보이게 한다
  qEl.addEventListener("keydown", e => { if (e.key === "Enter") qEl.blur(); });
  document.getElementById("clear").addEventListener("click", () => { qEl.value = ""; update(); qEl.focus(); });
  update();
  qEl.focus();
}
</script>
</body>
</html>
